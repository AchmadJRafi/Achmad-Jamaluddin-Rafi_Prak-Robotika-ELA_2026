amcl:
  ros__parameters:
    min_particles: 500
    max_particles: 2000
    laser_max_range: 3.5
    update_min_d: 0.2
    update_min_a: 0.2
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

controller_server:
  ros__parameters:
    FollowPath:
      max_vel_x: 0.20
      max_vel_theta: 1.2
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25

local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.105
      inflation_layer:
        inflation_radius: 0.25
        cost_scaling_factor: 3.0
